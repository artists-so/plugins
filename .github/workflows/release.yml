name: Release

# Changesets flow: PRs carry a changeset file describing the version bump;
# merging to main lets the action open (or update) a "Version Packages" PR;
# merging that PR publishes to npm. Requires the NPM_TOKEN repository secret
# (an npm automation token with publish rights on the @artists-so scope).

on:
  push:
    branches:
      - main

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm is used for the actual publish; setup-node provides auth wiring.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      # The secrets context is not available in job-level `if`, so the gate
      # lives in a step: without NPM_TOKEN the workflow explains and succeeds
      # instead of failing red on every push.
      - name: Detect npm token
        id: npm
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: No npm token yet
        if: steps.npm.outputs.present != 'true'
        run: echo "::notice::NPM_TOKEN secret is not set — skipping version/publish. Add an npm automation token with publish rights on the @artists-so scope to enable releases."

      - name: Create version PR or publish
        if: steps.npm.outputs.present == 'true'
        uses: changesets/action@v1
        with:
          publish: bun run release
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
